services:
  godhcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: godhcp:1.0
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ../configs/example.yml:/etc/godhcp/config.yml:ro
      - godhcp-data:/var/lib/godhcp
    restart: unless-stopped

volumes:
  godhcp-data:
