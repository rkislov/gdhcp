apiVersion: v1
kind: Service
metadata:
  name: godhcp
spec:
  selector:
    app: godhcp
  ports:
    - name: api
      port: {{ .Values.service.apiPort }}
      targetPort: api
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
