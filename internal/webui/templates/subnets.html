{{define "subnets.html"}}<!DOCTYPE html><html lang="ru"><head>{{template "head" .}}</head>
<body data-page="subnets" data-ui-prefix="{{.Prefix}}" >{{template "nav" .}}<main id="main" class="app-main">{{template "page-header" .}}<details class="card" data-role-min="admin"><summary><span class="flex items-center gap-2 text-sm"><svg class="size-4 text-blue-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Добавить подсеть</span><svg class="details-chevron size-4 text-slate-400 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary><form id="create" class="form-grid"><label>Идентификатор<input name="id" type="text" placeholder="office-lan" required ></label><label>Сеть CIDR<input name="network" type="text" placeholder="192.168.10.0/24" required ></label><label>Диапазон выдачи<input name="range" type="text" placeholder="192.168.10.100, 192.168.10.200" ></label><label>Шлюз<input name="gateway" type="text" placeholder="192.168.10.1" ></label><label>DNS-серверы<input name="dns" type="text" placeholder="1.1.1.1, 8.8.8.8" ></label><label>VLAN<input name="vlan" type="number" placeholder="Не задан" min="1" max="4094"></label><div class="form-actions"><button class="btn btn-primary w-full sm:w-auto" type="submit"><svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Добавить</button></div></form></details><section class="card"><div class="card-heading"><h2>Настроенные подсети</h2><span id="table-count" class="badge">Загрузка…</span></div><div class="table-wrap"><table><thead><tr><th scope="col">Подсеть</th><th scope="col">Сеть</th><th scope="col">Диапазон выдачи</th><th scope="col">Шлюз</th><th scope="col">VLAN</th><th scope="col">Действия</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty-state">Загрузка данных…</td></tr></tbody></table></div></section></main>{{template "foot" .}}</body></html>{{end}}
