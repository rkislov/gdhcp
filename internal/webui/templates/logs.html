{{define "logs.html"}}<!DOCTYPE html><html lang="ru"><head>{{template "head" .}}</head>
<body data-page="logs" data-ui-prefix="{{.Prefix}}" >{{template "nav" .}}<main id="main" class="app-main">{{template "page-header" .}}<section class="card"><div class="card-heading"><div class="flex items-center gap-3"><h2>Поток событий</h2><span id="stream-status" class="badge">Подключение…</span></div><div class="flex gap-2"><button class="btn" id="pause-logs" type="button">Пауза</button><button class="btn" id="clear-logs" type="button">Очистить экран</button></div></div><div class="border-b border-slate-100 p-4 dark:border-slate-800"><label class="sr-only" for="log-filter">Фильтр журнала</label><input id="log-filter" placeholder="Фильтр по IP, MAC, уровню или тексту события"></div><div id="log" class="h-[55vh] min-h-80 overflow-auto bg-slate-950 text-slate-300" role="log" aria-label="События сервера" aria-live="off"><div class="empty-state text-slate-400">Ожидание событий сервера…</div></div><div class="pagination"><span id="log-count">События не получены</span><label class="flex-row items-center gap-2"><input class="size-3.5" id="autoscroll" type="checkbox" checked>Прокручивать автоматически</label></div></section></main>{{template "foot" .}}</body></html>{{end}}
