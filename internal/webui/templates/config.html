{{define "config.html"}}
<!DOCTYPE html>
<html lang="ru">
<head>{{template "head" .}}</head>
<body data-page="config">
{{template "nav" .}}
<main>
  <h1>Конфигурация</h1>
  <textarea id="yaml" spellcheck="false"></textarea>
  <div class="row">
    <button type="button" id="check">Проверить</button>
    <button type="button" class="primary" id="save">Применить</button>

{{template "foot" .}}
